    async function callDeepSeek(userAnswer, reference, chinese) {
        const prompt = `你是一位经验丰富的法语教师。请对学生的法语翻译进行详细点评，指出具体错误（语法、词汇、语序等），解释原因，并给出相关知识点讲解。最后给出一个0-100的分数。

返回格式必须为JSON，示例如下：
{
  "score": 75,
  "comment": "总体意思正确，但有2处语法错误。",
  "analysis": "1. 动词变位错误...\n2. 名词阴阳性错误...",
  "knowledge": "法语动词变位需要根据主语变化...",
  "suggestion": "建议改为：${reference}"
}

学生任务：
中文原句：${chinese}
标准法语翻译：${reference}
学生的法语译文：${userAnswer}

请严格按照JSON格式返回，不要有其他文字。`;
        try {
            // 注意：这里直接调用DeepSeek API，会因CORS失败，但用户可配置代理后修改地址
            const response = await fetch("https://api.deepseek.com/v1/chat/completions", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${deepseekApiKey}` },
                body: JSON.stringify({
                    model: "deepseek-chat",
                    messages: [{ role: "system", content: "你是一名法语教师，输出必须为合法JSON。" }, { role: "user", content: prompt }],
                    temperature: 0.3,
                    max_tokens: 800
                })
            });
            if (!response.ok) throw new Error(`API错误 ${response.status}`);
            const data = await response.json();
            let content = data.choices[0].message.content.replace(/```json/g, '').replace(/```/g, '').trim();
            const parsed = JSON.parse(content);
            return {
                score: parsed.score,
                comment: parsed.comment || "评语生成失败",
                analysis: parsed.analysis || "暂无详细分析",
                knowledge: parsed.knowledge || "暂无知识点",
                suggestion: parsed.suggestion || `参考答案: ${reference}`
            };
        } catch (err) {
            console.warn("DeepSeek调用失败:", err);
            return null;
        }
    }

    function simulateScore(userAnswer, reference, chinese) {
        let normalize = (s) => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^\w\s]/g, '');
        let userNorm = normalize(userAnswer);
        let refNorm = normalize(reference);
        let userWords = userNorm.split(/\s+/);
        let refWords = refNorm.split(/\s+/);
        let match = 0;
        for (let w of userWords) if (refWords.includes(w)) match++;
        let base = Math.floor((match / Math.max(refWords.length,1)) * 70);
        base = Math.min(base, 80);
        if (Math.abs(userWords.length - refWords.length) > 3) base -= 10;
        base = Math.max(20, base);
        let finalScore = Math.min(100, base + Math.floor(Math.random() * 10));
        let comment = finalScore >= 85 ? "非常棒！表达地道～" : (finalScore >= 65 ? "不错，再注意一些细节会更完美。" : "还需要加强，请对照参考答案学习。");
        let suggestion = finalScore < 80 ? `参考答案: ${reference}` : "继续保持！";
        return {
            score: finalScore,
            comment: comment,
            analysis: "（模拟评分模式，无法提供详细语法分析，启用AI后可获得详细讲解）",
            knowledge: "（启用AI后可获得知识点讲解）",
            suggestion: suggestion
        };
    }

        } else {

        }
    }

            <div>📝 ${comment}</div>
            ${analysisHtml}
            ${knowledgeHtml}
            <div style="margin-top:8px;">💡 ${suggestion}</div>
            <div style="margin-top:12px;"><button id="speakResultBtn" class="audio-btn" style="background:#e9ecef;"><i class="fas fa-volume-up"></i> 朗读参考答案</button></div>
        `;
        resultPanel.style.display = "block";
        let speakResultBtn = document.getElementById('speakResultBtn');
        if (speakResultBtn) speakResultBtn.addEventListener('click', () => speakText(currentQuestionObj.french, 'fr-FR'));
        if (score < 65) {
            if (!mistakeList.some(m => m.chinese === currentQuestionObj.chinese && m.userAnswer === userAnswer)) {
                mistakeList.unshift({
                    chinese: currentQuestionObj.chinese,
                    userAnswer: userAnswer,
                    correctAnswer: currentQuestionObj.french,
                    category: currentCategory,
                    timestamp: new Date().toLocaleString(),
                    analysis: analysis,
                    knowledge: knowledge
                });
                if (mistakeList.length > 50) mistakeList.pop();
                saveMistakes();
            }
        }
        answered = true;
        nextBtn.disabled = false;
        nextBtn.style.opacity = "1";
        submitBtn.disabled = true;
        if (currentMode === 'sequential' && score >= 70) {
            currentIndex++;
            saveCurrentProgress();
            updateProgressDisplay();
        }
        submitBtn.innerHTML = '<i class="fas fa-check-circle"></i> 提交评分';
    }

    function onNext() {
        if (!answered && resultPanel.style.display !== "block") return alert("请先提交当前题目的答案");
        if (currentMode === 'sequential' && answered && lastScore < 70) {
            currentIndex++;
            saveCurrentProgress();
        }
        loadQuestion();
        answered = false;
        canSubmit = true;
        submitBtn.disabled = false;
        nextBtn.disabled = true;
        nextBtn.style.opacity = "0.6";
    }

    function switchCategory(catId) {
        if (catId === currentCategory) return;
        currentCategory = catId;
        document.querySelectorAll('.cat-btn').forEach(btn => {
            if (btn.dataset.cat === catId) btn.classList.add('active');
            else btn.classList.remove('active');
        });
        reloadSequentialList();
        loadQuestion();
        answered = false;
        submitBtn.disabled = false;
        nextBtn.disabled = true;
        resultPanel.style.display = "none";
    }

    function switchMode(mode) {
        currentMode = mode;
        document.querySelectorAll('.mode-btn').forEach(btn => {
            if (btn.dataset.mode === mode) btn.classList.add('active');
            else btn.classList.remove('active');
        });
        if (mode === 'sequential') reloadSequentialList();
        loadQuestion();
    }

    function renderCategoryButtons() {
        categoryContainer.innerHTML = '';
        CATEGORIES.forEach(cat => {
            let btn = document.createElement('button');
            btn.className = `cat-btn ${cat.id === currentCategory ? 'active' : ''}`;
            btn.dataset.cat = cat.id;
            btn.innerHTML = `<i class="fas ${cat.icon}"></i> ${cat.name}`;
            btn.addEventListener('click', () => switchCategory(cat.id));
            categoryContainer.appendChild(btn);
        });
    }

    function showMistakes() {
        if (mistakeContainerDiv.style.display === 'block') { mistakeContainerDiv.style.display = 'none'; return; }
        if (mistakeList.length === 0) {
            mistakeContainerDiv.innerHTML = `<div style="padding:12px;text-align:center;">✨ 暂无错题，继续加油！</div>`;
            mistakeContainerDiv.style.display = 'block';
            return;
        }
        let html = `<div style="font-weight:600;">📚 错题集 <button id="clearAllMistakes" style="background:#cbd5e1; padding:2px 12px; border-radius:20px; border:none;">清空全部</button></div>`;
        mistakeList.forEach((m, idx) => {
            html += `<div class="mistake-item">
                        <div><strong>${m.chinese}</strong></div>
                        <div>❌ 你的答案: ${m.userAnswer}</div>
                        <div>✅ 正确: ${m.correctAnswer}</div>
                        ${m.analysis ? `<div style="margin-top:4px;"><span style="color:#b45f2b;">📖 分析:</span> ${m.analysis.substring(0,100)}${m.analysis.length>100?'...':''}</div>` : ''}
                        <div style="font-size:0.7rem;">${m.timestamp}</div>
                        <button class="small-del" data-idx="${idx}">删除</button>
                     </div>`;
        });
        mistakeContainerDiv.innerHTML = html;
        mistakeContainerDiv.style.display = 'block';
        document.querySelectorAll('.small-del').forEach(btn => {
            btn.addEventListener('click', (e) => {
                let idx = parseInt(btn.dataset.idx);
                mistakeList.splice(idx, 1);
                saveMistakes();
                showMistakes();
            });
        });
        let clearBtn = document.getElementById('clearAllMistakes');
        if (clearBtn) clearBtn.addEventListener('click', () => { if (confirm("清空所有错题？")) { mistakeList = []; saveMistakes(); showMistakes(); } });
    }

    function resetProgress() {
        if (confirm("重置会清除当前分类的学习进度和积分、错题本，确定吗？")) {
            totalScore = 0;
            mistakeList = [];
            saveScore();
            saveMistakes();
            localStorage.removeItem(`progress_${currentCategory}`);
            reloadSequentialList();
            loadQuestion();
            alert("已重置");
        }
    }

    function enableAI() {
        let key = apiKeyInput.value.trim();
        if (!key) {
            alert("请输入 DeepSeek API Key");
            return;
        }
        deepseekApiKey = key;
        useRealAI = true;
        saveApiKey(key);
        aiStatusBadge.innerText = "AI模式 (DeepSeek)";
        aiStatusBadge.classList.add('active');
        alert("AI 评分已启用！注意：由于浏览器跨域限制，直接调用DeepSeek会失败，如需真正使用请配置cors-anywhere代理，或仅在演示时展示AI功能设计。");
    }
    function disableAI() {
        useRealAI = false;
        deepseekApiKey = "";
        localStorage.removeItem('deepseek_api_key');
        aiStatusBadge.innerText = "模拟评分";
        aiStatusBadge.classList.remove('active');
        alert("已切换回模拟评分模式。");
    }

    function init() {
        renderCategoryButtons();
        loadLocalData();
        reloadSequentialList();
        loadQuestion();
        submitBtn.addEventListener('click', onSubmit);
        nextBtn.addEventListener('click', onNext);
        showMistakesBtn.addEventListener('click', showMistakes);
        resetProgressBtn.addEventListener('click', resetProgress);
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', () => switchMode(btn.dataset.mode));
        });
        speakChineseBtn.addEventListener('click', () => { if (currentQuestionObj) speakText(currentQuestionObj.chinese, 'zh-CN'); });
        speakFrenchBtn.addEventListener('click', () => { if (currentQuestionObj) speakText(currentQuestionObj.french, 'fr-FR'); });
        enableAiBtn.addEventListener('click', enableAI);
        disableAiBtn.addEventListener('click', disableAI);
        if (window.speechSynthesis) window.speechSynthesis.getVoices();
    }
    init();
</script>
</body>
</html>
